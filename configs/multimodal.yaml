# Multimodal overrides for a local, unquantized Qwen2-VL run.
# Load together with configs/default.yaml when defaults are also required.

model:
  llm_name: "Qwen/Qwen2-VL-7B-Instruct"
  vlm_name: "Qwen/Qwen2-VL-7B-Instruct"
  claim_extractor_model: "Qwen/Qwen2-VL-7B-Instruct"
  nli_name: "cross-encoder/nli-deberta-v3-base"
  embedding_name: "all-MiniLM-L6-v2"

sampling:
  M: 10
  temperature: 0.7

pruning:
  strategy: "attention_masking"

thresholds:
  mode: "adaptive"

modality:
  type: "multimodal"
  image_detail: "high"
  table_format: "markdown"
